
name: OddsPortal parser

on:
  workflow_dispatch:

  schedule:
    - cron: "*/15 * * * *"

permissions:
  contents: write

concurrency:
  group: oddsportal-parser
  cancel-in-progress: false

jobs:
  scrape:
    name: Scrape OddsPortal
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      # 1. Завантаження репозиторію
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      # 2. Python
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      # 3. Встановлення залежностей
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          python -m playwright install --with-deps chromium

      # 4. Запуск парсера
      - name: Run OddsPortal parser
        env:
          PYTHONUNBUFFERED: "1"
        run: |
          python scrape_oddsportal.py

      # 5. Перевірка результатів
      - name: Check generated data
        run: |
          echo "Files in data/:"
          ls -lah data/

          test -f data/oddsportal_latest.csv
          test -f data/oddsportal_debug.json

      # 6. Збереження результатів у GitHub
      - name: Commit and push data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add data/

          if git diff --cached --quiet; then
            echo "No new data changes to commit."
          else
            git commit -m "Update OddsPortal data"
          fi

          # Оновлюємо локальну гілку перед відправленням
          git fetch origin main
          git rebase origin/main

          # Відправляємо без примусового перезапису
          git push origin HEAD:main

      # 7. Підсумок
      - name: Workflow summary
        if: always()
        run: |
          echo "## OddsPortal parser" >> "$GITHUB_STEP_SUMMARY"
          echo "Finished: $(date -u)" >> "$GITHUB_STEP_SUMMARY"
          echo "Repository: Yaretti/oddsportal-parser" >> "$GITHUB_STEP_SUMMARY"
